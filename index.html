<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Expenses</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Expenses">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f5f5f0; --surface: #ffffff; --border: rgba(0,0,0,0.1); --border-md: rgba(0,0,0,0.18);
    --text: #1a1a1a; --text2: #666; --text3: #aaa;
    --green: #3B6D11; --green-bg: #eaf3de;
    --red: #A32D2D; --red-bg: #fcebeb;
    --blue: #185FA5; --blue-bg: #e6f1fb;
    --amber: #854F0B; --amber-bg: #faeeda;
    --radius: 12px; --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111; --surface: #1e1e1e; --border: rgba(255,255,255,0.1); --border-md: rgba(255,255,255,0.18);
      --text: #f0f0f0; --text2: #999; --text3: #555;
      --green: #7dc44e; --green-bg: #1a2e0a;
      --red: #e06060; --red-bg: #2e0f0f;
      --blue: #6aabf0; --blue-bg: #0c1e33;
      --amber: #EF9F27; --amber-bg: #2a1e08;
    }
  }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, 'SF Pro Text', sans-serif; font-size: 16px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .app { max-width: 480px; margin: 0 auto; padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 32px); padding-top: max(env(safe-area-inset-top), 16px); }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 16px; }
  .header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header-sub { font-size: 13px; color: var(--text2); margin-top: 1px; }
  .gear-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 17px; }
  .tabs { display: flex; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 14px; gap: 3px; }
  .tab { flex: 1; padding: 8px; font-size: 13px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; background: none; color: var(--text2); font-family: -apple-system, sans-serif; transition: background 0.15s, color 0.15s; }
  .tab.active { background: var(--red); color: #fff; }
  .tab.active.income-tab { background: var(--green); color: #fff; }
  .tab.active.savings-tab { background: var(--blue); color: #fff; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .field { margin-bottom: 11px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text3); margin-bottom: 5px; }
  .field input, .field select { width: 100%; font-size: 16px; font-family: -apple-system, sans-serif; background: var(--bg); border: 0.5px solid var(--border-md); border-radius: var(--radius-sm); color: var(--text); padding: 11px 12px; outline: none; -webkit-appearance: none; appearance: none; transition: border-color 0.12s; }
  .field input:focus, .field select:focus { border-color: var(--blue); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .amt-wrap { position: relative; }
  .amt-wrap .sym { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text2); pointer-events: none; }
  .amt-wrap input { padding-left: 24px; }
  .cat-row { display: flex; gap: 7px; align-items: flex-end; }
  .cat-row select, .cat-row input { flex: 1; min-width: 0; }
  .ai-pill { height: 42px; padding: 0 11px; background: var(--blue-bg); color: var(--blue); border: none; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; font-family: -apple-system, sans-serif; transition: opacity 0.12s; }
  .ai-pill:active { opacity: 0.7; }
  .other-btn { background: none; border: none; padding: 4px 0 0; font-size: 12px; color: var(--blue); cursor: pointer; font-family: -apple-system, sans-serif; text-align: left; }
  .submit-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; font-family: -apple-system, sans-serif; border: none; border-radius: var(--radius-sm); cursor: pointer; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 7px; transition: opacity 0.12s, transform 0.08s; -webkit-appearance: none; }
  .submit-btn:active { opacity: 0.75; transform: scale(0.98); }
  .submit-btn.exp-submit { background: var(--red); color: #fff; }
  .submit-btn.inc-submit { background: var(--green); color: #fff; }
  .submit-btn.sav-submit { background: var(--blue); color: #fff; }
  .totals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .t-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 11px; }
  .t-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); margin-bottom: 4px; }
  .t-val { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; }
  .t-meta { font-size: 10px; color: var(--text3); margin-top: 2px; }
  .budget-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 13px; margin-bottom: 12px; }
  .bb-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .bb-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); }
  .bb-net { font-size: 13px; font-weight: 700; }
  .stacked-bar { height: 10px; background: var(--green); border-radius: 99px; overflow: hidden; display: flex; }
  .bar-seg { height: 100%; transition: width 0.4s ease; }
  .bar-spend { background: var(--red); } .bar-save { background: var(--blue); }
  .bar-legend { display: flex; gap: 14px; margin-top: 8px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .log-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
  .log-hd { padding: 11px 14px; border-bottom: 0.5px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; }
  @keyframes fadein { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:none; } }
  .log-wrap { position: relative; overflow: hidden; border-bottom: 0.5px solid var(--border); }
  .log-wrap:last-child { border-bottom: none; }
  .log-del-bg { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: var(--red); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .log-del-bg span { color: #fff; font-size: 13px; font-weight: 700; }
  .log-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; animation: fadein 0.2s ease; background: var(--surface); position: relative; z-index: 1; transition: transform 0.25s ease; touch-action: pan-y; user-select: none; will-change: transform; }
  .log-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .log-info { flex: 1; min-width: 0; }
  .log-place { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-cat { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .log-right { text-align: right; flex-shrink: 0; }
  .log-amt { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .log-date { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .log-amt.pos { color: var(--green); } .log-amt.sav { color: var(--amber); }
  .empty { padding: 28px; text-align: center; font-size: 14px; color: var(--text3); }
  .toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 16px) + 16px); left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 99px; font-size: 13px; font-weight: 500; white-space: nowrap; z-index: 200; transition: transform 0.25s ease, opacity 0.25s; opacity: 0; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.ok { background: var(--green); color: #fff; } .toast.err { background: var(--red); color: #fff; }
  .modal-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.5); align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 20px calc(env(safe-area-inset-bottom, 20px) + 20px); width: 100%; max-width: 480px; }
  .modal-handle { width: 36px; height: 4px; background: var(--border-md); border-radius: 99px; margin: 0 auto 20px; }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; line-height: 1.5; }
  .modal-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; font-family: -apple-system, sans-serif; border: none; border-radius: var(--radius-sm); cursor: pointer; -webkit-appearance: none; margin-bottom: 10px; }
  .modal-btn.primary { background: var(--text); color: var(--bg); }
  .modal-btn.secondary { background: var(--blue-bg); color: var(--blue); }
  .modal-btn.danger { background: var(--red-bg); color: var(--red); }
  .modal-btn:active { opacity: 0.75; }
  .modal-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .chip { display: none; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--green); background: var(--green-bg); padding: 5px 10px; border-radius: 99px; }
  .chip.show { display: flex; }
  .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ── Drawer ── */
  .drawer-overlay { display: none; position: fixed; inset: 0; z-index: 150; background: rgba(0,0,0,0); transition: background 0.25s; }
  .drawer-overlay.open { display: block; background: rgba(0,0,0,0.4); }
  .drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-width: 80vw; background: var(--surface); z-index: 151; transform: translateX(-100%); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; padding-top: max(env(safe-area-inset-top), 16px); box-shadow: 4px 0 24px rgba(0,0,0,0.15); }
  .drawer.open { transform: translateX(0); }
  .drawer-header { padding: 8px 20px 16px; border-bottom: 0.5px solid var(--border); }
  .drawer-title { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; }
  .drawer-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .drawer-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); padding: 14px 20px 6px; }
  .drawer-months { flex: 1; overflow-y: auto; }
  .drawer-month-row { display: flex; align-items: center; padding: 11px 20px; cursor: pointer; transition: background 0.12s; gap: 12px; }
  .drawer-month-row:active { background: var(--bg); }
  .drawer-month-row.active-month { background: var(--bg); }
  .drawer-month-name { font-size: 14px; font-weight: 600; flex: 1; }
  .drawer-month-net { font-size: 12px; font-variant-numeric: tabular-nums; }
  .drawer-month-net.pos { color: var(--green); }
  .drawer-month-net.neg { color: var(--red); }
  .drawer-divider { height: 0.5px; background: var(--border); margin: 8px 0; }
  .drawer-settings { padding: 12px 20px calc(env(safe-area-inset-bottom, 16px) + 12px); border-top: 0.5px solid var(--border); }
  .drawer-settings-btn { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 14px; color: var(--text2); cursor: pointer; background: none; border: none; font-family: -apple-system, sans-serif; width: 100%; }
  .drawer-settings-btn:active { color: var(--text); }
  .hamburger-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-direction: column; gap: 4px; padding: 10px; }
  .hamburger-btn span { display: block; width: 100%; height: 1.5px; background: var(--text); border-radius: 2px; transition: background 0.12s; }
  .month-indicator { font-size: 12px; color: var(--text2); background: var(--bg); padding: 3px 10px; border-radius: 99px; font-weight: 500; }

  /* ── Recurring panel ── */
  .panel-overlay { display: none; position: fixed; inset: 0; z-index: 160; background: rgba(0,0,0,0.45); align-items: flex-end; justify-content: center; }
  .panel-overlay.open { display: flex; }
  .panel { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; max-height: 88vh; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 16px); }
  .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 12px; border-bottom: 0.5px solid var(--border); }
  .panel-title { font-size: 17px; font-weight: 700; }
  .panel-close { background: none; border: none; font-size: 22px; color: var(--text3); cursor: pointer; padding: 0 4px; font-family: -apple-system, sans-serif; }
  .panel-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .rec-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 8px; }
  .rec-info { flex: 1; min-width: 0; }
  .rec-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .rec-amount { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 4px; }
  .rec-log-btn { background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600; font-family: -apple-system, sans-serif; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .rec-log-btn:active { opacity: 0.75; }
  .rec-log-btn.logged { background: var(--green); }
  .rec-del-btn { background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; padding: 2px 6px; flex-shrink: 0; }
  .rec-del-btn:active { color: var(--red); }
  .rec-add-form { background: var(--bg); border-radius: var(--radius-sm); padding: 12px; margin-top: 8px; }
  .rec-add-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); margin-bottom: 10px; }
  .rec-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .rec-field label { display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); margin-bottom: 4px; }
  .rec-field input, .rec-field select { width: 100%; font-size: 15px; font-family: -apple-system, sans-serif; background: var(--surface); border: 0.5px solid var(--border-md); border-radius: var(--radius-sm); color: var(--text); padding: 9px 11px; outline: none; -webkit-appearance: none; }
  .rec-add-btn { width: 100%; padding: 11px; font-size: 14px; font-weight: 600; font-family: -apple-system, sans-serif; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); cursor: pointer; margin-top: 4px; }
  .rec-add-btn:active { opacity: 0.75; }
  .rec-empty { text-align: center; padding: 20px; font-size: 13px; color: var(--text3); }
  .status-row { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="hamburger-btn" onclick="openDrawer()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div>
        <div class="header-title" id="month-title">Expenses</div>
        <div class="header-sub" id="month-sub"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="chip" id="chip"><span class="chip-dot"></span>Sheets</div>
      <div class="month-indicator" id="viewing-indicator" style="display:none;"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-exp" onclick="switchTab('expense')">Expense</button>
    <button class="tab income-tab" id="tab-inc" onclick="switchTab('income')">Income</button>
    <button class="tab savings-tab" id="tab-sav" onclick="switchTab('savings')">Savings</button>
  </div>

  <div class="card" id="exp-form">
    <div class="row2">
      <div class="field"><label>Place</label><input type="text" id="place" placeholder="Starbucks" oninput="onPlace(this.value)" autocomplete="off" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label>Amount</label><div class="amt-wrap"><span class="sym">$</span><input type="number" id="amount" placeholder="0.00" step="0.01" min="0" inputmode="decimal"></div></div>
    </div>
    <div class="field">
      <label>Category</label>
      <div class="cat-row">
        <select id="cat-select"><option value="">Select…</option><option>Food &amp; Dining</option><option>Golf &amp; Entertainment</option><option>Travel</option><option>Groceries</option><option>Gas &amp; Auto</option><option>Shopping</option><option>Subscriptions</option></select>
        <input type="text" id="cat-custom" placeholder="Type category…" style="display:none;" autocorrect="off">
        <button class="ai-pill" id="ai-pill" onclick="applyAI()">✦ AI</button>
      </div>
      <button class="other-btn" id="other-btn" onclick="toggleCustom()">+ other category</button>
    </div>
    <div class="field"><label>Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;">(optional)</span></label><input type="text" id="notes" placeholder="e.g. team lunch"></div>
    <button class="submit-btn exp-submit" onclick="addExpense()">+ Add expense</button>
  </div>

  <div class="card" id="inc-form" style="display:none;">
    <div class="row2">
      <div class="field"><label>Source</label><input type="text" id="inc-source" placeholder="Payroll" autocomplete="off" autocorrect="off"></div>
      <div class="field"><label>Amount</label><div class="amt-wrap"><span class="sym">$</span><input type="number" id="inc-amount" placeholder="0.00" step="0.01" min="0" inputmode="decimal"></div></div>
    </div>
    <div class="field">
      <label>Budget month <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;">— which month is this for?</span></label>
      <select id="inc-budget-month"></select>
    </div>
    <div class="field"><label>Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;">(optional)</span></label><input type="text" id="inc-notes" placeholder="e.g. bi-weekly salary"></div>
    <button class="submit-btn inc-submit" onclick="addIncome()">+ Add income</button>
  </div>

  <div class="card" id="sav-form" style="display:none;">
    <div class="row2">
      <div class="field"><label>Account / goal</label><input type="text" id="sav-dest" placeholder="e.g. HYSA, 401k" autocomplete="off" autocorrect="off"></div>
      <div class="field"><label>Amount</label><div class="amt-wrap"><span class="sym">$</span><input type="number" id="sav-amount" placeholder="0.00" step="0.01" min="0" inputmode="decimal"></div></div>
    </div>
    <div class="field">
      <label>Budget month <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;">— which month is this for?</span></label>
      <select id="sav-budget-month"></select>
    </div>
    <div class="field"><label>Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;">(optional)</span></label><input type="text" id="sav-notes" placeholder="e.g. monthly transfer"></div>
    <button class="submit-btn sav-submit" onclick="addSavings()">+ Add savings</button>
  </div>

  <div class="totals-grid">
    <div class="t-card"><div class="t-label">Week spend</div><div class="t-val" id="wk-val">$0</div><div class="t-meta" id="wk-range">Mon–Sun</div></div>
    <div class="t-card"><div class="t-label">Month income</div><div class="t-val" id="mo-inc-val" style="color:var(--green);">$0</div><div class="t-meta" id="mo-inc-ct">0 entries</div></div>
    <div class="t-card"><div class="t-label">Month spend</div><div class="t-val" id="mo-spend-val">$0</div><div class="t-meta" id="mo-exp-ct">0 entries</div></div>
    <div class="t-card"><div class="t-label">Month saved</div><div class="t-val" id="mo-sav-val" style="color:var(--blue);">$0</div><div class="t-meta" id="mo-sav-ct">0 entries</div></div>
  </div>

  <div class="budget-card">
    <div class="bb-head"><span class="bb-label">Income breakdown</span><span class="bb-net" id="bb-net">—</span></div>
    <div class="stacked-bar"><div class="bar-seg bar-spend" id="bar-spend"></div><div class="bar-seg bar-save" id="bar-save"></div></div>
    <div class="bar-legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>Spent</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--blue)"></span>Saved</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>Remaining</div>
    </div>
  </div>

  <div class="log-card">

<script>
const WORKER_URL = 'https://expenses.4nd7f84nfy.workers.dev';

const CAT_MAP = {
  starbucks:'Food & Dining', coffee:'Food & Dining', mcdonald:'Food & Dining', chipotle:'Food & Dining',
  subway:'Food & Dining', dunkin:'Food & Dining', doordash:'Food & Dining', ubereats:'Food & Dining',
  grubhub:'Food & Dining', pizza:'Food & Dining', 'taco bell':'Food & Dining', 'chick-fil-a':'Food & Dining',
  'in-n-out':'Food & Dining', panera:'Food & Dining', restaurant:'Food & Dining', cafe:'Food & Dining',
  grill:'Food & Dining', kitchen:'Food & Dining', sushi:'Food & Dining', burger:'Food & Dining',
  'whole foods':'Groceries', 'trader joe':'Groceries', safeway:'Groceries', kroger:'Groceries',
  vons:'Groceries', ralphs:'Groceries', costco:'Groceries', sprouts:'Groceries', aldi:'Groceries',
  albertson:'Groceries', grocery:'Groceries',
  shell:'Gas & Auto', chevron:'Gas & Auto', arco:'Gas & Auto', exxon:'Gas & Auto', mobil:'Gas & Auto',
  valero:'Gas & Auto', autozone:'Gas & Auto', 'jiffy lube':'Gas & Auto', carwash:'Gas & Auto', parking:'Gas & Auto',
  uber:'Travel', lyft:'Travel', airbnb:'Travel', hotel:'Travel', marriott:'Travel', hilton:'Travel',
  hyatt:'Travel', delta:'Travel', united:'Travel', southwest:'Travel', flight:'Travel', airline:'Travel',
  golf:'Golf & Entertainment', topgolf:'Golf & Entertainment', taylormade:'Golf & Entertainment',
  callaway:'Golf & Entertainment', pga:'Golf & Entertainment', cinema:'Golf & Entertainment', theater:'Golf & Entertainment',
  netflix:'Subscriptions', spotify:'Subscriptions', hulu:'Subscriptions', disney:'Subscriptions',
  youtube:'Subscriptions', adobe:'Subscriptions', 'amazon prime':'Subscriptions',
  amazon:'Shopping', target:'Shopping', walmart:'Shopping', 'best buy':'Shopping',
  nordstrom:'Shopping', nike:'Shopping', adidas:'Shopping',
};
const CAT_COLORS = {
  'Food & Dining':'#E24B4A','Golf & Entertainment':'#1D9E75','Travel':'#378ADD',
  'Groceries':'#639922','Gas & Auto':'#BA7517','Shopping':'#D4537E','Subscriptions':'#7F77DD',
};

let data = JSON.parse(localStorage.getItem('et_data_v4') || '{"expenses":[],"income":[],"savings":[]}');
let recurring = JSON.parse(localStorage.getItem('et_recurring_v1') || '[]');
let customMode=false, aiSug=null, toastTimer;

function init() {
  const now = new Date();
  document.getElementById('month-title').textContent = now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  document.getElementById('log-month').textContent = now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const ws=weekStart(), we=new Date(ws); we.setDate(ws.getDate()+6);
  document.getElementById('wk-range').textContent =
    ws.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'–'+we.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  document.getElementById('chip').classList.add('show');
  populateBudgetMonths();
  render();
  initSwipe();
}

function populateBudgetMonths() {
  const now = new Date();
  // Offer current month and next month
  const months = [];
  for (let i=0; i<=1; i++) {
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    months.push(d.toLocaleDateString('en-US',{month:'long',year:'numeric'}));
  }
  ['inc-budget-month','sav-budget-month'].forEach(id => {
    const sel = document.getElementById(id);
    const cur = sel.value;
    sel.innerHTML = months.map((m,i) =>
      `<option value="${m}"${i===0?' selected':''}>${m}${i===0?' (this month)':' (next month)'}</option>`
    ).join('');
    if (cur && months.includes(cur)) sel.value = cur;
  });
}

function weekStart() {
  const d=new Date(); d.setHours(0,0,0,0);
  const day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1)); return d;
}
function fmt(n) { return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function switchTab(t) {
  ['expense','income','savings'].forEach(x=>document.getElementById('tab-'+x.slice(0,3)).classList.toggle('active',x===t));
  document.getElementById('exp-form').style.display=t==='expense'?'':'none';
  document.getElementById('inc-form').style.display=t==='income'?'':'none';
  document.getElementById('sav-form').style.display=t==='savings'?'':'none';
}

function onPlace(v) {
  aiSug=null; const low=v.toLowerCase();
  for (const [k,cat] of Object.entries(CAT_MAP)) { if(low.includes(k)){aiSug=cat;break;} }
  const pill=document.getElementById('ai-pill');
  if (aiSug&&!customMode) { pill.textContent='✦ '+aiSug.split(' ')[0]; document.getElementById('cat-select').value=aiSug; }
  else pill.textContent='✦ AI';
}
function applyAI() { if(aiSug&&!customMode) document.getElementById('cat-select').value=aiSug; }
function toggleCustom() {
  customMode=!customMode;
  document.getElementById('cat-select').style.display=customMode?'none':'';
  document.getElementById('cat-custom').style.display=customMode?'':'none';
  document.getElementById('ai-pill').style.display=customMode?'none':'';
  document.getElementById('other-btn').textContent=customMode?'← back to list':'+ other category';
  if(customMode) document.getElementById('cat-custom').focus();
}
function getCategory() { return customMode?document.getElementById('cat-custom').value.trim():document.getElementById('cat-select').value; }

function addExpense() {
  const place=document.getElementById('place').value.trim(), amount=parseFloat(document.getElementById('amount').value),
        cat=getCategory(), notes=document.getElementById('notes').value.trim();
  if(!place||isNaN(amount)||amount<=0||!cat){toast('Fill in place, amount, and category','err');return;}
  const entryDate = viewingMonth ? new Date(viewingMonth) : new Date();
  if (viewingMonth) entryDate.setDate(15); // mid-month for past entries
  const entry={type:'expense',date:entryDate.toISOString(),place,amount,category:cat,notes};
  data.expenses.push(entry); save(); syncEntry(entry);
  ['place','amount','notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('cat-select').value=''; document.getElementById('cat-custom').value='';
  document.getElementById('ai-pill').textContent='✦ AI'; aiSug=null;
  if(customMode)toggleCustom(); render(); document.getElementById('place').focus();
}
function addIncome() {
  const source=document.getElementById('inc-source').value.trim(), amount=parseFloat(document.getElementById('inc-amount').value),
        notes=document.getElementById('inc-notes').value.trim(), budgetMonth=document.getElementById('inc-budget-month').value;
  if(!source||isNaN(amount)||amount<=0){toast('Fill in source and amount','err');return;}
  const entryDate2 = viewingMonth ? new Date(viewingMonth) : new Date();
  if (viewingMonth) entryDate2.setDate(15);
  const entry={type:'income',date:entryDate2.toISOString(),source,amount,notes,budgetMonth};
  data.income.push(entry); save(); syncEntry(entry);
  ['inc-source','inc-amount','inc-notes'].forEach(id=>document.getElementById(id).value='');
  populateBudgetMonths(); render(); switchTab('expense');
}
function addSavings() {
  const dest=document.getElementById('sav-dest').value.trim(), amount=parseFloat(document.getElementById('sav-amount').value),
        notes=document.getElementById('sav-notes').value.trim(), budgetMonth=document.getElementById('sav-budget-month').value;
  if(!dest||isNaN(amount)||amount<=0){toast('Fill in account and amount','err');return;}
  const entryDate3 = viewingMonth ? new Date(viewingMonth) : new Date();
  if (viewingMonth) entryDate3.setDate(15);
  const entry={type:'savings',date:entryDate3.toISOString(),dest,amount,notes,budgetMonth};
  data.savings.push(entry); save(); syncEntry(entry);
  ['sav-dest','sav-amount','sav-notes'].forEach(id=>document.getElementById(id).value='');
  populateBudgetMonths(); render(); switchTab('expense');
}
function save() { localStorage.setItem('et_data_v4',JSON.stringify(data)); }

function render() {
  const now=new Date(), ws=weekStart();
  // Use viewingMonth if set, otherwise current month
  const curMonth = viewingMonth || now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const viewDate = viewingMonth ? new Date(viewingMonth) : now;
  const ms = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  const me = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0, 23, 59, 59);
  let wkSpend=0,moSpend=0,moIncome=0,moSavings=0;
  const moExp=[],moInc=[],moSav=[];
  data.expenses.forEach(e=>{const d=new Date(e.date);if(d>=ms&&d<=me){moSpend+=e.amount;moExp.push(e);}if(!viewingMonth&&d>=ws)wkSpend+=e.amount;});
  data.income.forEach(e=>{
    const budgetM=e.budgetMonth||new Date(e.date).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    if(budgetM===curMonth){moIncome+=e.amount;moInc.push(e);}
  });
  data.savings.forEach(e=>{
    const budgetM=e.budgetMonth||new Date(e.date).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    if(budgetM===curMonth){moSavings+=e.amount;moSav.push(e);}
  });
  document.getElementById('wk-val').textContent=fmt(wkSpend);
  document.getElementById('mo-spend-val').textContent=fmt(moSpend);
  document.getElementById('mo-inc-val').textContent=fmt(moIncome);
  document.getElementById('mo-sav-val').textContent=fmt(moSavings);
  document.getElementById('mo-exp-ct').textContent=moExp.length+' entr'+(moExp.length===1?'y':'ies');
  document.getElementById('mo-inc-ct').textContent=moInc.length+' entr'+(moInc.length===1?'y':'ies');
  document.getElementById('mo-sav-ct').textContent=moSav.length+' entr'+(moSav.length===1?'y':'ies');
  const remaining=moIncome-moSpend-moSavings, netEl=document.getElementById('bb-net');
  if(moIncome===0){netEl.textContent='No income logged';netEl.style.color='var(--text3)';}
  else{netEl.textContent=remaining>=0?fmt(remaining)+' left':fmt(Math.abs(remaining))+' over';netEl.style.color=remaining>=0?'var(--green)':'var(--red)';}
  const spendPct=moIncome>0?Math.min((moSpend/moIncome)*100,100):0;
  const savePct=moIncome>0?Math.min((moSavings/moIncome)*100,Math.max(0,100-spendPct)):0;
  const bsEl=document.getElementById('bar-spend');
  bsEl.style.cssText='width:'+spendPct.toFixed(1)+'%;background:#A32D2D;height:100%;border-radius:99px 0 0 99px;transition:width 0.4s ease;';
  const bvEl=document.getElementById('bar-save');
  bvEl.style.cssText='width:'+savePct.toFixed(1)+'%;background:#185FA5;height:100%;transition:width 0.4s ease;';
  const all=[...moExp.map((e,i)=>({...e,_t:'expense',_idx:data.expenses.indexOf(e)})),...moInc.map((e,i)=>({...e,_t:'income',_idx:data.income.indexOf(e)})),...moSav.map((e,i)=>({...e,_t:'savings',_idx:data.savings.indexOf(e)}))]
    .sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20);
  const list=document.getElementById('log-list');
  if(!all.length){list.innerHTML='<div class="empty">No entries yet</div>';return;}
  list.innerHTML=all.map(e=>{
    const d=new Date(e.date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    if(e._t==='income'){const bm=e.budgetMonth&&e.budgetMonth!==new Date(e.date).toLocaleDateString('en-US',{month:'long',year:'numeric'})?`<span style="font-size:10px;background:var(--green-bg);color:var(--green);padding:1px 5px;border-radius:4px;margin-left:4px;">${e.budgetMonth.split(' ')[0]}</span>`:''; return `<div class="log-wrap"><div class="log-del-bg" onclick="deleteEntry('income','${e._idx}')"><span>Delete</span></div><div class="log-row" data-type="income" data-idx="${e._idx}"><span class="log-dot" style="background:var(--green)"></span><div class="log-info"><div class="log-place">${e.source}${bm}</div><div class="log-cat">Income</div></div><div class="log-right"><div class="log-amt pos">+${fmt(e.amount)}</div><div class="log-date">${d}</div></div></div></div>`;}
    if(e._t==='savings'){const bm=e.budgetMonth&&e.budgetMonth!==new Date(e.date).toLocaleDateString('en-US',{month:'long',year:'numeric'})?`<span style="font-size:10px;background:var(--blue-bg);color:var(--blue);padding:1px 5px;border-radius:4px;margin-left:4px;">${e.budgetMonth.split(' ')[0]}</span>`:''; return `<div class="log-wrap"><div class="log-del-bg" onclick="deleteEntry('savings','${e._idx}')"><span>Delete</span></div><div class="log-row" data-type="savings" data-idx="${e._idx}"><span class="log-dot" style="background:var(--blue)"></span><div class="log-info"><div class="log-place">${e.dest}${bm}</div><div class="log-cat">Savings</div></div><div class="log-right"><div class="log-amt sav">${fmt(e.amount)}</div><div class="log-date">${d}</div></div></div></div>`;}
    const col=CAT_COLORS[e.category]||'#888';
    return `<div class="log-wrap"><div class="log-del-bg" onclick="deleteEntry('expense','${e._idx}')"><span>Delete</span></div><div class="log-row" data-type="expense" data-idx="${e._idx}"><span class="log-dot" style="background:${col}"></span><div class="log-info"><div class="log-place">${e.place}</div><div class="log-cat">${e.category}</div></div><div class="log-right"><div class="log-amt">${fmt(e.amount)}</div><div class="log-date">${d}</div></div></div></div>`;
  }).join('');
  setTimeout(initSwipe, 50);
}

// ── Worker calls ──────────────────────────────────────────────────────────────
async function workerReq(action, method='GET', body=null, params={}) {
  const url = new URL(`${WORKER_URL}/sheets/${action}`);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url.toString(), opts);
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); } catch(e) { throw new Error('Bad response ('+res.status+'): '+text.slice(0,100)); }
  if (json.error) throw new Error(json.error.message || json.error);
  return json;
}

function hexToRgb(hex) {
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  return {red:r,green:g,blue:b};
}

async function ensureTab(tabName) {
  const meta = await workerReq('meta');
  const existing = meta.sheets.find(s=>s.properties.title===tabName);
  if (existing) return existing.properties.sheetId;
  const res = await workerReq('batchUpdate','POST',{requests:[{addSheet:{properties:{title:tabName,gridProperties:{rowCount:1000,columnCount:6}}}}]});
  return res.replies[0].addSheet.properties.sheetId;
}

async function testConnection() {
  const dot=document.getElementById('status-dot'), txt=document.getElementById('status-text');
  txt.textContent='Testing…'; dot.style.background='var(--amber)';
  try {
    const meta = await workerReq('meta');
    const name = meta.properties.title;
    dot.style.background='var(--green)';
    txt.textContent='Connected — "'+name+'"';
    document.getElementById('chip').classList.add('show');
    toast('Connected ✓','ok');
  } catch(err) {
    dot.style.background='var(--red)';
    txt.textContent='Error: '+err.message;
    toast('Connection failed','err');
  }
}

async function initSheet() {
  const btn=document.getElementById('init-btn');
  btn.disabled=true; btn.textContent='⏳ Setting up…';
  try {
    const now=new Date();
    const tabName=now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const sheetId=await ensureTab(tabName);

    const meta=await workerReq('meta');
    const summaryExists=meta.sheets.find(s=>s.properties.title==='Summary');
    let summarySheetId;
    if(!summaryExists){
      const sr=await workerReq('batchUpdate','POST',{requests:[{addSheet:{properties:{title:'Summary',index:0}}}]});
      summarySheetId=sr.replies[0].addSheet.properties.sheetId;
    } else { summarySheetId=summaryExists.properties.sheetId; }

    await workerReq('put','PUT',{values:[
      ['Date','Type','Description','Category','Amount','Notes'],
      ['TOTAL INCOME','','','','=SUMIF(B6:B1000,"INCOME",E6:E1000)',''],
      ['TOTAL EXPENSES','','','','=SUMIF(B6:B1000,"EXPENSE",E6:E1000)',''],
      ['TOTAL SAVINGS','','','','=SUMIF(B6:B1000,"SAVINGS",E6:E1000)',''],
      ['NET','','','','=E2-E3-E4',''],
      ['','','','','',''],
    ]},{tab:tabName,range:tabName+'!A1:F6'});

    const WHITE=hexToRgb('#ffffff'),DARK=hexToRgb('#1a1a1a'),GREEN=hexToRgb('#3B6D11'),
          AMBER=hexToRgb('#854F0B'),RED=hexToRgb('#A32D2D'),LGRAY=hexToRgb('#f5f5f0'),MGRAY=hexToRgb('#e8e8e3');

    await workerReq('batchUpdate','POST',{requests:[
      ...[110,90,200,140,100,180].map((px,i)=>({updateDimensionProperties:{range:{sheetId,dimension:'COLUMNS',startIndex:i,endIndex:i+1},properties:{pixelSize:px},fields:'pixelSize'}})),
      {repeatCell:{range:{sheetId,startRowIndex:0,endRowIndex:1,startColumnIndex:0,endColumnIndex:6},cell:{userEnteredFormat:{backgroundColor:DARK,textFormat:{foregroundColor:WHITE,bold:true,fontSize:11},horizontalAlignment:'CENTER',verticalAlignment:'MIDDLE'}},fields:'userEnteredFormat'}},
      {repeatCell:{range:{sheetId,startRowIndex:1,endRowIndex:5,startColumnIndex:0,endColumnIndex:6},cell:{userEnteredFormat:{backgroundColor:LGRAY,textFormat:{bold:true,fontSize:10}}},fields:'userEnteredFormat'}},
      {repeatCell:{range:{sheetId,startRowIndex:1,endRowIndex:2,startColumnIndex:4,endColumnIndex:5},cell:{userEnteredFormat:{textFormat:{foregroundColor:GREEN,bold:true},numberFormat:{type:'CURRENCY',pattern:'"$"#,##0.00'}}},fields:'userEnteredFormat'}},
      {repeatCell:{range:{sheetId,startRowIndex:2,endRowIndex:3,startColumnIndex:4,endColumnIndex:5},cell:{userEnteredFormat:{textFormat:{foregroundColor:RED,bold:true},numberFormat:{type:'CURRENCY',pattern:'"$"#,##0.00'}}},fields:'userEnteredFormat'}},
      {repeatCell:{range:{sheetId,startRowIndex:3,endRowIndex:4,startColumnIndex:4,endColumnIndex:5},cell:{userEnteredFormat:{textFormat:{foregroundColor:AMBER,bold:true},numberFormat:{type:'CURRENCY',pattern:'"$"#,##0.00'}}},fields:'userEnteredFormat'}},
      {repeatCell:{range:{sheetId,startRowIndex:4,endRowIndex:5,startColumnIndex:4,endColumnIndex:5},cell:{userEnteredFormat:{textFormat:{bold:true},numberFormat:{type:'CURRENCY',pattern:'"$"#,##0.00'}}},fields:'userEnteredFormat'}},
      {repeatCell:{range:{sheetId,startRowIndex:6,endRowIndex:1000,startColumnIndex:4,endColumnIndex:5},cell:{userEnteredFormat:{numberFormat:{type:'CURRENCY',pattern:'"$"#,##0.00'}}},fields:'userEnteredFormat'}},
      {updateSheetProperties:{properties:{sheetId,gridProperties:{frozenRowCount:6}},fields:'gridProperties.frozenRowCount'}},
      {repeatCell:{range:{sheetId,startRowIndex:1,endRowIndex:5,startColumnIndex:0,endColumnIndex:1},cell:{userEnteredFormat:{textFormat:{bold:true,fontSize:10},backgroundColor:MGRAY}},fields:'userEnteredFormat'}},
    ]});

    await workerReq('put','PUT',{values:[['Month','Total Income','Total Expenses','Total Savings','Net']]},{tab:'Summary',range:'Summary!A1:E1'});
    await workerReq('batchUpdate','POST',{requests:[
      {repeatCell:{range:{sheetId:summarySheetId,startRowIndex:0,endRowIndex:1,startColumnIndex:0,endColumnIndex:5},cell:{userEnteredFormat:{backgroundColor:DARK,textFormat:{foregroundColor:WHITE,bold:true,fontSize:11},horizontalAlignment:'CENTER'}},fields:'userEnteredFormat'}},
      ...[120,130,140,130,120].map((px,i)=>({updateDimensionProperties:{range:{sheetId:summarySheetId,dimension:'COLUMNS',startIndex:i,endIndex:i+1},properties:{pixelSize:px},fields:'pixelSize'}})),
      {repeatCell:{range:{sheetId:summarySheetId,startRowIndex:1,endRowIndex:100,startColumnIndex:1,endColumnIndex:5},cell:{userEnteredFormat:{numberFormat:{type:'CURRENCY',pattern:'"$"#,##0.00'}}},fields:'userEnteredFormat'}},
      {updateSheetProperties:{properties:{sheetId:summarySheetId,gridProperties:{frozenRowCount:1}},fields:'gridProperties.frozenRowCount'}},
    ]});

    // Write formula row for this month into Summary
    await updateSummaryRow(tabName, summarySheetId);

    document.getElementById('status-dot').style.background='var(--green)';
    document.getElementById('status-text').textContent='Sheet initialized ✓';
    toast('Sheet ready ✓','ok');
    closeModal();
  } catch(err) { toast('Init failed: '+err.message,'err'); }
  btn.disabled=false; btn.textContent='🗂 Initialize / format sheet';
}

// Write or update a row in Summary tab for the given month
async function updateSummaryRow(tabName) {
  try {
    const meta = await workerReq('meta');
    const summarySheet = meta.sheets.find(s=>s.properties.title==='Summary');
    if (!summarySheet) return;
    const summarySheetId = summarySheet.properties.sheetId;

    // Calculate totals using budgetMonth for income/savings, real date for expenses
    const now2 = new Date();
    const monthStart = new Date(now2.getFullYear(), now2.getMonth(), 1);
    let income=0, expenses=0, savings=0;
    data.income.forEach(e=>{
      const bm=e.budgetMonth||new Date(e.date).toLocaleDateString('en-US',{month:'long',year:'numeric'});
      if(bm===tabName) income+=e.amount;
    });
    data.expenses.forEach(e=>{ if(new Date(e.date)>=monthStart) expenses+=e.amount; });
    data.savings.forEach(e=>{
      const bm=e.budgetMonth||new Date(e.date).toLocaleDateString('en-US',{month:'long',year:'numeric'});
      if(bm===tabName) savings+=e.amount;
    });
    const net = income - expenses - savings;

    // Find existing row for this month or append a new one
    let rows = [];
    try {
      const existing = await workerReq('getRaw','GET',null,{range:'Summary!A2:A50'});
      rows = existing.values || [];
    } catch(e) { rows = []; }

    let rowIndex = -1;
    for (let i=0; i<rows.length; i++) {
      if (String(rows[i][0]||'').trim() === tabName) { rowIndex = i+2; break; }
    }
    if (rowIndex === -1) rowIndex = rows.length + 2;

    const ri = rowIndex - 1; // 0-based

    // Write plain values — no formulas, no cross-tab refs, no date parsing risk
    await workerReq('batchUpdate','POST',{requests:[
      {updateCells:{
        rows:[{values:[
          {userEnteredValue:{stringValue:tabName},
           userEnteredFormat:{numberFormat:{type:'TEXT'},textFormat:{bold:true,fontSize:11}}},
          {userEnteredValue:{numberValue:income},
           userEnteredFormat:{numberFormat:{type:'CURRENCY',pattern:'"$"#,##0.00'}}},
          {userEnteredValue:{numberValue:expenses},
           userEnteredFormat:{numberFormat:{type:'CURRENCY',pattern:'"$"#,##0.00'}}},
          {userEnteredValue:{numberValue:savings},
           userEnteredFormat:{numberFormat:{type:'CURRENCY',pattern:'"$"#,##0.00'}}},
          {userEnteredValue:{numberValue:net},
           userEnteredFormat:{numberFormat:{type:'CURRENCY',pattern:'"$"#,##0.00'}}},
        ]}],
        fields:'userEnteredValue,userEnteredFormat',
        start:{sheetId:summarySheetId,rowIndex:ri,columnIndex:0}
      }}
    ]});

  } catch(e) { console.log('Summary update failed:', e.message); }
}

async function syncEntry(entry) {
  const now=new Date(entry.date);
  // If viewing a past month, log entry to that month's tab
  const tab=viewingMonth || now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const dateStr=now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  let row;
  if(entry.type==='income')  row=[dateStr,'INCOME', entry.source,'', entry.amount.toFixed(2),entry.notes, entry.budgetMonth||''];
  else if(entry.type==='savings') row=[dateStr,'SAVINGS',entry.dest,'', entry.amount.toFixed(2),entry.notes, entry.budgetMonth||''];
  else                       row=[dateStr,'EXPENSE',entry.place, entry.category,entry.amount.toFixed(2),entry.notes];
  try {
    const meta=await workerReq('meta');
    const exists=meta.sheets.find(s=>s.properties.title===tab);
    if(!exists) await initSheet();
    await workerReq('append','POST',{values:[row]},{tab});
    await updateSummaryRow(tab);
    toast('Synced ✓','ok');
  } catch(err){toast('Sync failed: '+err.message,'err');}
}

// Delete an entry locally and from the sheet
async function deleteEntry(type, idx) {
  idx = parseInt(idx);
  let entry;
  if (type==='expense')      { entry=data.expenses[idx]; data.expenses.splice(idx,1); }
  else if (type==='income')  { entry=data.income[idx];   data.income.splice(idx,1); }
  else if (type==='savings') { entry=data.savings[idx];  data.savings.splice(idx,1); }
  if (!entry) return;
  save(); render();

  // Find and delete the matching row in the sheet
  try {
    const now = new Date(entry.date);
    const tab = now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const desc = entry.place || entry.source || entry.dest || '';
    const amt = parseFloat(entry.amount.toFixed(2));

    // Get metadata first for sheetId
    const meta = await workerReq('meta');
    const sheet = meta.sheets.find(s=>s.properties.title===tab);
    if (!sheet) { toast('Removed locally','ok'); return; }
    const sheetId = sheet.properties.sheetId;

    // Read raw values so we get numbers as numbers, not formatted strings
    const sheetData = await workerReq('getRaw','GET',null,{range:tab+'!A6:F1000'});
    const rows = sheetData.values || [];

    let matchRow = -1;
    for (let i=0; i<rows.length; i++) {
      const rowDesc = String(rows[i][2]||'').trim();
      const rowAmt  = parseFloat(rows[i][4]||0);
      // Match on description and amount — robust across date format differences
      if (rowDesc === desc && Math.abs(rowAmt - amt) < 0.001) {
        matchRow = i + 5; // 0-based: array[0] = sheet row 6 = index 5
        break;
      }
    }
    if (matchRow === -1) { toast('Removed locally — row not found in sheet','ok'); return; }

    // Delete the row
    await workerReq('batchUpdate','POST',{requests:[{
      deleteDimension:{range:{sheetId,dimension:'ROWS',startIndex:matchRow,endIndex:matchRow+1}}
    }]});

    await updateSummaryRow(tab);
    toast('Deleted ✓','ok');
  } catch(err) { toast('Removed locally ('+err.message+')','err'); }
}

function clearData() {
  if(confirm('Clear all local data? This won\'t affect your Google Sheet.')) {
    localStorage.removeItem('et_data_v4');
    data={expenses:[],income:[],savings:[]};
    render();
    closeModal();
    toast('Local data cleared','ok');
  }
}

// ── Swipe to delete ──────────────────────────────────────────────────────────
function initSwipe() {
  document.getElementById('log-list').addEventListener('touchstart', onTouchStart, {passive:true});
  document.getElementById('log-list').addEventListener('touchmove', onTouchMove, {passive:false});
  document.getElementById('log-list').addEventListener('touchend', onTouchEnd, {passive:true});
}

let swipeEl=null, swipeStartX=0, swipeStartY=0, swipeDx=0, swipeLocked=false;
const SWIPE_THRESHOLD = 60; // px to reveal delete button

function getRow(el) {
  while (el && !el.classList.contains('log-row')) el=el.parentElement;
  return el;
}

function onTouchStart(e) {
  const row = getRow(e.target);
  if (!row) return;
  // Close any other open rows
  document.querySelectorAll('.log-row').forEach(r => {
    if (r !== row) r.style.transform = '';
  });
  swipeEl = row;
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swipeDx = 0;
  swipeLocked = false;
}

function onTouchMove(e) {
  if (!swipeEl) return;
  const dx = e.touches[0].clientX - swipeStartX;
  const dy = e.touches[0].clientY - swipeStartY;
  // If scrolling vertically, ignore
  if (!swipeLocked && Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 5) { swipeEl=null; return; }
  if (Math.abs(dx) > 5) swipeLocked = true;
  if (!swipeLocked) return;
  e.preventDefault();
  swipeDx = Math.min(0, dx); // only allow left swipe
  const clamped = Math.max(-80, swipeDx);
  swipeEl.style.transform = 'translateX('+clamped+'px)';
}

function onTouchEnd(e) {
  if (!swipeEl) return;
  if (swipeDx < -SWIPE_THRESHOLD) {
    // Snap open to reveal delete
    swipeEl.style.transform = 'translateX(-80px)';
  } else {
    // Snap closed
    swipeEl.style.transform = '';
  }
  swipeEl = null;
  swipeDx = 0;
}

// Tap anywhere else to close open swipe rows
document.addEventListener('touchstart', function(e) {
  if (!e.target.closest('.log-wrap')) {
    document.querySelectorAll('.log-row').forEach(r => r.style.transform = '');
  }
}, {passive:true});

function toast(msg,type) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show '+(type||'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className='toast',3200);
}
function openModal() { document.getElementById('modal-overlay').classList.add('open'); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function bgClose(e) { if(e.target===document.getElementById('modal-overlay'))closeModal(); }

// ── Drawer ────────────────────────────────────────────────────────────────────
let viewingMonth = null; // null = current month

function openDrawer() {
  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  renderDrawerMonths();
}

function closeDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function getMonthKey(date) {
  return new Date(date).toLocaleDateString('en-US',{month:'long',year:'numeric'});
}

function isValidMonth(m) {
  // Must match "Month YYYY" format with a valid year between 2000-2099
  if (!m || typeof m !== 'string') return false;
  const match = m.match(/^([A-Za-z]+)\s+(20\d{2})$/);
  if (!match) return false;
  const validMonths = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return validMonths.includes(match[1]);
}

function getAllMonths() {
  const months = new Set();
  const now = new Date();
  months.add(now.toLocaleDateString('en-US',{month:'long',year:'numeric'}));
  data.expenses.forEach(e => { const m=getMonthKey(e.date); if(isValidMonth(m)) months.add(m); });
  data.income.forEach(e => { const bm=e.budgetMonth||getMonthKey(e.date); if(isValidMonth(bm)) months.add(bm); });
  data.savings.forEach(e => { const bm=e.budgetMonth||getMonthKey(e.date); if(isValidMonth(bm)) months.add(bm); });


  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function monthToNum(m) {
    const match = m.match(/^([A-Za-z]+)\s+(20\d{2})$/);
    if (!match) return 0;
    return parseInt(match[2]) * 12 + MONTHS.indexOf(match[1]);
  }
  return Array.from(months).filter(isValidMonth).sort((a,b) => monthToNum(b) - monthToNum(a));
}

function getMonthTotals(monthName) {
  let income=0, expenses=0, savings=0;
  data.expenses.forEach(e => {
    if (getMonthKey(e.date) === monthName) expenses += e.amount;
  });
  data.income.forEach(e => {
    const bm = e.budgetMonth || getMonthKey(e.date);
    if (bm === monthName) income += e.amount;
  });
  data.savings.forEach(e => {
    const bm = e.budgetMonth || getMonthKey(e.date);
    if (bm === monthName) savings += e.amount;
  });
  return { income, expenses, savings, net: income - expenses - savings };
}

function renderDrawerMonths() {
  const months = getAllMonths();
  const now = new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const container = document.getElementById('drawer-months');

  if (!months.length) {
    container.innerHTML = '<div style="padding:20px;font-size:13px;color:var(--text3);">No months yet.</div>';
    return;
  }

  container.innerHTML = months.map(m => {
    const t = getMonthTotals(m);
    const isActive = (viewingMonth === m) || (viewingMonth === null && m === now);
    const isCurrent = m === now;
    const netClass = t.net >= 0 ? 'pos' : 'neg';
    const netStr = (t.net >= 0 ? '+' : '-') + fmt(t.net);
    return `<div class="drawer-month-row ${isActive ? 'active-month' : ''}" onclick="selectMonth('${m}')">
      <div>
        <div class="drawer-month-name">${m}${isCurrent ? ' <span style="font-size:10px;color:var(--text3);font-weight:400;">current</span>' : ''}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px;">
          <span style="color:var(--green);">${fmt(t.income)}</span> in &nbsp;·&nbsp;
          <span style="color:var(--red);">${fmt(t.expenses)}</span> out &nbsp;·&nbsp;
          <span style="color:var(--blue);">${fmt(t.savings)}</span> saved
        </div>
      </div>
      <div class="drawer-month-net ${netClass}">${netStr}</div>
    </div>`;
  }).join('<div class="drawer-divider"></div>');
}

function selectMonth(monthName) {
  const now = new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'});
  viewingMonth = monthName === now ? null : monthName;
  closeDrawer();

  // Update header
  document.getElementById('month-title').textContent = monthName;
  const indicator = document.getElementById('viewing-indicator');
  if (viewingMonth) {
    indicator.textContent = 'viewing past month';
    indicator.style.display = 'block';
  } else {
    indicator.style.display = 'none';
  }

  render();
}

async function syncFromSheet() {
  const btn = document.getElementById('sync-from-btn');
  btn.innerHTML = '<span style="font-size:18px;">⏳</span> Restoring…';

  try {
    // Get all sheet tabs
    const meta = await workerReq('meta');
    const tabs = meta.sheets
      .map(s => s.properties.title)
      .filter(t => {
        if (t === 'Summary') return false;
        // Must contain a valid 4-digit year between 2000-2099
        const yearMatch = t.match(/\b(20\d{2})\b/);
        return yearMatch !== null;
      });

    if (!tabs.length) {
      toast('No month tabs found in sheet', 'err');
      btn.innerHTML = '<span style="font-size:18px;">⬇️</span> Restore from sheet';
      return;
    }

    const newData = { expenses: [], income: [], savings: [] };

    for (const tab of tabs) {
      try {
        // Read whole sheet from row 2 — handles both old and new layouts
        const res = await workerReq('getRaw', 'GET', null, { range: tab + '!A2:G1000' });
        const rows = res.values || [];

        for (const row of rows) {
          if (!row || row.length < 3) continue;
          const dateStr  = String(row[0] || '').trim();
          const type     = String(row[1] || '').trim().toUpperCase();
          const desc     = String(row[2] || '').trim();
          const category = String(row[3] || '').trim();
          const amount   = parseFloat(row[4]);
          const notes    = String(row[5] || '').trim();
          const budgetMonth = String(row[6] || '').trim();

          // Skip header rows, summary rows, empty rows, and non-entry types
          if (!type || !['EXPENSE','INCOME','SAVINGS'].includes(type)) continue;
          if (!desc || isNaN(amount) || amount <= 0) continue;

          // Parse date — skip bad dates
          const parsedDate = new Date(dateStr);
          if (isNaN(parsedDate) || parsedDate.getFullYear() < 2000 || parsedDate.getFullYear() > 2100) continue;
          const isoDate = parsedDate.toISOString();

          if (type === 'EXPENSE') {
            newData.expenses.push({ type:'expense', date:isoDate, place:desc, amount, category, notes });
          } else if (type === 'INCOME') {
            newData.income.push({ type:'income', date:isoDate, source:desc, amount, notes, budgetMonth: budgetMonth || tab });
          } else if (type === 'SAVINGS') {
            newData.savings.push({ type:'savings', date:isoDate, dest:desc, amount, notes, budgetMonth: budgetMonth || tab });
          }
        }
      } catch(tabErr) {
        console.log('Skipping tab', tab, tabErr.message);
      }
    }

    const totalEntries = newData.expenses.length + newData.income.length + newData.savings.length;
    if (totalEntries === 0) {
      toast('No entries found in sheet', 'err');
      btn.innerHTML = '<span style="font-size:18px;">⬇️</span> Restore from sheet';
      return;
    }

    data = newData;
    save();
    render();
    renderDrawerMonths();
    closeDrawer();
    toast('Restored ' + totalEntries + ' entries ✓', 'ok');

  } catch(err) {
    toast('Restore failed: ' + err.message, 'err');
  }

  btn.innerHTML = '<span style="font-size:18px;">⬇️</span> Restore from sheet';
}

// ── Recurring ─────────────────────────────────────────────────────────────────
function saveRecurring() { localStorage.setItem('et_recurring_v1', JSON.stringify(recurring)); }

function openRecurring() {
  renderRecurringList();
  document.getElementById('rec-overlay').classList.add('open');
}
function closeRecurring() { document.getElementById('rec-overlay').classList.remove('open'); }
function closeRecurringIfBg(e) { if (e.target === document.getElementById('rec-overlay')) closeRecurring(); }

function addRecurring() {
  const name     = document.getElementById('rec-name').value.trim();
  const amount   = parseFloat(document.getElementById('rec-amount').value);
  const category = document.getElementById('rec-category').value;
  const notes    = document.getElementById('rec-notes').value.trim();
  if (!name || isNaN(amount) || amount <= 0 || !category) {
    toast('Fill in name, amount, and category', 'err'); return;
  }
  recurring.push({ id: Date.now(), name, amount, category, notes });
  saveRecurring();
  document.getElementById('rec-name').value = '';
  document.getElementById('rec-amount').value = '';
  document.getElementById('rec-category').value = '';
  document.getElementById('rec-notes').value = '';
  renderRecurringList();
  toast('Added to recurring ✓', 'ok');
}

function deleteRecurring(id) {
  recurring = recurring.filter(r => r.id !== id);
  saveRecurring();
  renderRecurringList();
}

function logRecurring(id) {
  const item = recurring.find(r => r.id === id);
  if (!item) return;
  const entry = {
    type: 'expense',
    date: new Date().toISOString(),
    place: item.name,
    amount: item.amount,
    category: item.category,
    notes: item.notes || 'recurring'
  };
  data.expenses.push(entry);
  save();
  syncEntry(entry);
  render();

  // Mark as logged this month
  const btn = document.getElementById('rec-btn-' + id);
  if (btn) { btn.textContent = '✓ Logged'; btn.classList.add('logged'); btn.disabled = true; }
}

function isLoggedThisMonth(item) {
  const now = new Date();
  const ms = new Date(now.getFullYear(), now.getMonth(), 1);
  const me = new Date(now.getFullYear(), now.getMonth()+1, 0, 23, 59, 59);
  return data.expenses.some(e =>
    e.place === item.name &&
    Math.abs(e.amount - item.amount) < 0.01 &&
    new Date(e.date) >= ms &&
    new Date(e.date) <= me
  );
}

function renderRecurringList() {
  const list = document.getElementById('rec-list');
  if (!recurring.length) {
    list.innerHTML = '<div class="rec-empty">No recurring expenses yet — add one below</div>';
    return;
  }

  const CAT_COLORS_REC = {
    'Food & Dining':'#E24B4A','Golf & Entertainment':'#1D9E75','Travel':'#378ADD',
    'Groceries':'#639922','Gas & Auto':'#BA7517','Shopping':'#D4537E','Subscriptions':'#7F77DD',
  };

  list.innerHTML = recurring.map(r => {
    const logged = isLoggedThisMonth(r);
    const col = CAT_COLORS_REC[r.category] || '#888';
    return `<div class="rec-item">
      <span style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block;"></span>
      <div class="rec-info">
        <div class="rec-name">${r.name}</div>
        <div class="rec-meta">${r.category}${r.notes ? ' · ' + r.notes : ''}</div>
      </div>
      <span class="rec-amount">${fmt(r.amount)}</span>
      <button class="rec-log-btn ${logged ? 'logged' : ''}" id="rec-btn-${r.id}"
        onclick="logRecurring(${r.id})" ${logged ? 'disabled' : ''}>
        ${logged ? '✓ Logged' : 'Log'}
      </button>
      <button class="rec-del-btn" onclick="deleteRecurring(${r.id})">✕</button>
    </div>`;
  }).join('');
}

init();
</script>
